linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - gofmt
    - goimports
    - gosec
    - wrapcheck
    - testifylint
issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - wrapcheck
        - gosec
    - linters:
        - gosec
      text: "G304:" # skip file-path warnings
